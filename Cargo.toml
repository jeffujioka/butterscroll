[package]
name = "mfx"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Personal macOS mouse enhancer: button remapping, smooth scrolling, click-and-drag gestures. Inspired by Mac Mouse Fix."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
