[package]
name = "mfx"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Personal macOS mouse enhancer: button remapping, smooth scrolling, click-and-drag gestures. Inspired by Mac Mouse Fix."
publish = false

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tray-icon = "0.26"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[profile.release]
lto = true
codegen-units = 1
